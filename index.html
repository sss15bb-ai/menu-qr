<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171717">
<meta name="color-scheme" content="dark">
<title>Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Brand colors are overridden from menu.json -> theme */
  :root {
    --bg: #171717;
    --ink: #FFFFFF;
    --accent: #E87524;
    --secondary: #F5F0E8;
    --card: color-mix(in srgb, var(--bg) 90%, var(--ink));
    --card-2: color-mix(in srgb, var(--bg) 82%, var(--ink));
    --line: color-mix(in srgb, var(--bg) 84%, var(--ink));
    --muted: color-mix(in srgb, var(--ink) 62%, var(--bg));
    --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--bg));
    --accent-text: color-mix(in srgb, var(--accent) 70%, var(--ink));
    --on-accent: var(--bg);
    --danger: #FF7A6B;
    --danger-soft: rgba(255, 90, 70, 0.14);
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    font-family: "IBM Plex Sans Arabic", Tahoma, "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Header */
  header {
    padding: 20px 16px 18px; padding-top: max(20px, env(safe-area-inset-top));
    background:
      radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 60%),
      var(--bg);
    border-bottom: 3px solid var(--accent);
  }
  .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; max-width: 720px; margin: 0 auto; }
  .titles { min-width: 0; }
  header h1 {
    font-size: 1.7rem; font-weight: 700; line-height: 1.15; letter-spacing: 0.02em;
    overflow-wrap: anywhere;
  }
  #tagline {
    display: block; margin-top: 6px; color: var(--accent);
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em;
  }
  #cuisine { display: block; color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
  #langBtn {
    flex: 0 0 auto; min-height: 44px;
    background: transparent; color: var(--ink);
    border: 1px solid color-mix(in srgb, var(--ink) 35%, transparent); border-radius: 999px;
    padding: 8px 16px; font-weight: 600; font-size: 0.95rem;
  }
  #langBtn:active { background: color-mix(in srgb, var(--ink) 12%, transparent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px auto 0; max-width: 720px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.82rem; padding: 6px 12px; border-radius: 999px;
    background: var(--card-2); color: var(--secondary);
  }
  .chip b { color: var(--accent); font-weight: 700; }

  /* Category tabs */
  #tabs {
    display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line);
    scrollbar-width: none; scroll-snap-type: x proximity;
  }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button {
    flex: 0 0 auto; min-height: 44px; scroll-snap-align: start;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 8px 16px; font-size: 1rem; font-weight: 600;
    transition: background .15s, color .15s, border-color .15s;
  }
  #tabs button .ico { margin-inline-end: 6px; }
  #tabs button.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  /* Items */
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .section-title { font-size: 1.25rem; font-weight: 700; margin: 4px 2px 12px; }
  .section-note { color: var(--muted); font-size: 0.9rem; margin: -8px 2px 12px; }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; margin-bottom: 12px; display: flex; gap: 14px; align-items: flex-start;
  }
  .thumb {
    flex: 0 0 auto; width: 96px; height: 96px; border-radius: 14px;
    object-fit: cover; background: var(--secondary);
  }
  .info { flex: 1 1 auto; min-width: 0; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .item h3 { font-size: 1.08rem; font-weight: 700; line-height: 1.4; }
  .item p { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
  .price { font-weight: 700; white-space: nowrap; color: var(--accent); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag {
    font-size: 0.75rem; line-height: 1; padding: 6px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-text); white-space: nowrap;
  }
  .tag.off { background: var(--danger-soft); color: var(--danger); font-weight: 700; }
  .item.unavailable .thumb { filter: grayscale(1); opacity: 0.45; }
  .item.unavailable h3, .item.unavailable .price { color: var(--muted); }
  .item.unavailable .price { text-decoration: line-through; }

  /* Add-ons list */
  .addons { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .addon { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; min-height: 56px; }
  .addon + .addon { border-top: 1px solid var(--line); }
  .addon .name { font-weight: 600; }
  .addon.unavailable .name, .addon.unavailable .price { color: var(--muted); text-decoration: line-through; }

  /* Restaurant info */
  .about {
    margin-top: 24px; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px;
  }
  .about h2 { font-size: 1.1rem; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; color: var(--secondary); }
  .row .k { flex: 0 0 auto; width: 1.4em; text-align: center; }
  .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 10px 12px; border-radius: 14px; font-weight: 700; font-size: 0.95rem;
    background: var(--card-2); color: var(--ink); border: 1px solid var(--line); text-align: center;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn:active { transform: scale(0.98); }
  .ltr { direction: ltr; unicode-bidi: isolate; }

  .status { text-align: center; color: var(--muted); padding: 40px 16px; }
  footer {
    text-align: center; padding: 20px 16px; color: var(--muted); font-size: 0.85rem;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }

  @media (max-width: 380px) {
    header h1 { font-size: 1.45rem; }
    .thumb { width: 80px; height: 80px; }
    .top { flex-direction: column; align-items: flex-start; gap: 0; }
    .actions { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div class="titles">
      <h1 id="shopName"></h1>
      <span id="tagline" class="ltr"></span>
      <span id="cuisine"></span>
    </div>
    <button id="langBtn" type="button"></button>
  </div>
  <div id="chips" class="chips"></div>
</header>

<nav id="tabs" aria-label="Menu categories"></nav>
<main>
  <div id="items"><div class="status">…</div></div>
  <section id="about" class="about" hidden></section>
</main>
<footer id="footer"></footer>

<script>
// ===== Client data lives in menu.json =====
const LANGS = ["ar", "en"];
const DEFAULT_LANG = "ar";
const STORAGE_KEY = "menu-lang";
const UI = {
  ar: { unavailable: "غير متوفر", contains: "يحتوي على", switchTo: "English",
        free: "مجاناً", addonsNote: "تُضاف إلى أي وجبة.", delivery: "توصيل", pickup: "استلام من الفرع",
        about: "معلومات المطعم", call: "اتصال", whatsapp: "واتساب", instagram: "إنستغرام", map: "الموقع",
        error: "تعذّر تحميل المنيو. يرجى تحديث الصفحة." },
  en: { unavailable: "Unavailable", contains: "Contains", switchTo: "العربية",
        free: "Free", addonsNote: "Add to any meal.", delivery: "Delivery", pickup: "Pickup",
        about: "Restaurant info", call: "Call", whatsapp: "WhatsApp", instagram: "Instagram", map: "Location",
        error: "Could not load the menu. Please refresh the page." }
};

let DATA = null;
let lang = initialLang();
let activeCategory = 0;

// Priority: ?lang= in URL, then saved choice, then Arabic.
function initialLang() {
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (LANGS.indexOf(fromUrl) !== -1) { saveLang(fromUrl); return fromUrl; }
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (LANGS.indexOf(saved) !== -1) return saved;
  } catch (e) {}
  return DEFAULT_LANG;
}

function saveLang(l) {
  try { localStorage.setItem(STORAGE_KEY, l); } catch (e) {}
}

// Keep the URL in sync so a shared link opens in the same language.
function syncUrl() {
  try {
    const url = new URL(location.href);
    if (lang === DEFAULT_LANG) url.searchParams.delete("lang");
    else url.searchParams.set("lang", lang);
    history.replaceState(null, "", url);
  } catch (e) {}
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function link(href, className, text) {
  const a = el("a", className, text);
  a.href = href;
  if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
  return a;
}

function applyTheme(theme) {
  if (!theme) return;
  const map = { primary: "--accent", secondary: "--secondary", background: "--bg", text: "--ink" };
  Object.keys(map).forEach(function (k) {
    if (theme[k]) document.documentElement.style.setProperty(map[k], theme[k]);
  });
  if (theme.background) document.querySelector('meta[name="theme-color"]').content = theme.background;
}

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("langBtn").textContent = UI[lang].switchTo;
}

function txt(obj) { return obj ? obj[lang] : ""; }

function formatPrice(price, addon) {
  if (addon && !price) return UI[lang].free;
  return (addon ? "+" : "") + price + " " + DATA.currency[lang];
}

function renderHeader() {
  const t = UI[lang];
  document.title = txt(DATA.shop);
  document.getElementById("shopName").textContent = txt(DATA.shop);
  document.getElementById("tagline").textContent = txt(DATA.tagline);
  document.getElementById("cuisine").textContent = txt(DATA.cuisine);
  document.getElementById("footer").textContent = txt(DATA.footer);

  const chips = document.getElementById("chips");
  chips.innerHTML = "";
  const info = DATA.info || {};
  if (info.hours) chips.appendChild(el("span", "chip", "🕓 " + txt(info.hours)));
  if (info.delivery) chips.appendChild(el("span", "chip", "🛵 " + t.delivery));
  if (info.pickup) chips.appendChild(el("span", "chip", "🛍️ " + t.pickup));
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  DATA.categories.forEach(function (cat, i) {
    const b = el("button", i === activeCategory ? "active" : "");
    b.type = "button";
    if (cat.icon) b.appendChild(el("span", "ico", cat.icon));
    b.appendChild(document.createTextNode(cat[lang]));
    b.setAttribute("aria-pressed", i === activeCategory ? "true" : "false");
    b.addEventListener("click", function () {
      activeCategory = i;
      render();
      const nav = document.getElementById("tabs");
      if (window.scrollY > nav.offsetTop) window.scrollTo({ top: nav.offsetTop });
    });
    tabs.appendChild(b);
  });
  const activeTab = tabs.children[activeCategory];
  if (activeTab) activeTab.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function allergenTags(it, tags) {
  const t = UI[lang];
  (it.allergens || []).forEach(function (key) {
    const a = DATA.allergens && DATA.allergens[key];
    const label = a ? (a.icon ? a.icon + " " : "") + a[lang] : key;
    const tag = el("span", "tag", label);
    tag.title = t.contains + ": " + (a ? a[lang] : key);
    tags.appendChild(tag);
  });
}

function renderItems() {
  const t = UI[lang];
  const cat = DATA.categories[activeCategory];
  const list = document.getElementById("items");
  list.innerHTML = "";
  list.appendChild(el("h2", "section-title", (cat.icon ? cat.icon + " " : "") + cat[lang]));

  if (cat.addons) {
    list.appendChild(el("p", "section-note", t.addonsNote));
    const box = el("div", "addons");
    cat.items.forEach(function (it) {
      const available = it.available !== false;
      const row = el("div", "addon" + (available ? "" : " unavailable"));
      const left = el("div");
      left.appendChild(el("div", "name", it[lang]));
      const tags = el("div", "tags");
      if (!available) tags.appendChild(el("span", "tag off", t.unavailable));
      allergenTags(it, tags);
      if (tags.children.length) left.appendChild(tags);
      row.appendChild(left);
      row.appendChild(el("div", "price", formatPrice(it.price, true)));
      box.appendChild(row);
    });
    list.appendChild(box);
    return;
  }

  cat.items.forEach(function (it) {
    const available = it.available !== false;
    const row = el("article", "item" + (available ? "" : " unavailable"));

    if (it.image) {
      const img = el("img", "thumb");
      img.src = it.image;
      img.alt = it[lang];
      img.width = 96; img.height = 96;
      img.loading = "lazy"; img.decoding = "async";
      img.addEventListener("error", function () { img.remove(); });
      row.appendChild(img);
    }

    const info = el("div", "info");
    const top = el("div", "top");
    top.appendChild(el("h3", "", it[lang]));
    top.appendChild(el("div", "price", formatPrice(it.price, false)));
    info.appendChild(top);

    const desc = lang === "ar" ? it.descAr : it.descEn;
    if (desc) info.appendChild(el("p", "", desc));

    const tags = el("div", "tags");
    if (!available) tags.appendChild(el("span", "tag off", t.unavailable));
    allergenTags(it, tags);
    if (tags.children.length) info.appendChild(tags);

    row.appendChild(info);
    list.appendChild(row);
  });
}

function renderAbout() {
  const t = UI[lang];
  const info = DATA.info;
  const box = document.getElementById("about");
  box.innerHTML = "";
  if (!info) { box.hidden = true; return; }
  box.hidden = false;
  box.appendChild(el("h2", "", t.about));

  function row(icon, content) {
    const r = el("div", "row");
    r.appendChild(el("span", "k", icon));
    r.appendChild(content);
    box.appendChild(r);
  }
  if (info.address) row("📍", el("span", "", txt(info.address)));
  if (info.hours) row("🕓", el("span", "", txt(info.hours)));
  if (info.phone) row("📞", el("span", "ltr", info.phone));

  const actions = el("div", "actions");
  if (info.whatsapp) actions.appendChild(link("https://wa.me/" + info.whatsapp, "btn primary", "💬 " + t.whatsapp));
  if (info.phone) actions.appendChild(link("tel:" + info.phone, "btn", "📞 " + t.call));
  if (info.mapQuery) actions.appendChild(link("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(info.mapQuery), "btn", "📍 " + t.map));
  if (info.instagram) {
    const ig = link("https://instagram.com/" + info.instagram, "btn", "📸 ");
    ig.appendChild(el("span", "ltr", "@" + info.instagram));
    actions.appendChild(ig);
  }
  box.appendChild(actions);
}

function render() {
  applyLang();
  renderHeader();
  renderTabs();
  renderItems();
  renderAbout();
}

document.getElementById("langBtn").addEventListener("click", function () {
  lang = lang === "ar" ? "en" : "ar";
  saveLang(lang);
  syncUrl();
  if (DATA) render(); else applyLang();
});

applyLang();
fetch("menu.json", { cache: "no-cache" })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function (json) { DATA = json; applyTheme(DATA.theme); render(); })
  .catch(function (err) {
    console.error(err);
    const list = document.getElementById("items");
    list.innerHTML = "";
    list.appendChild(el("div", "status", UI[lang].error));
  });
</script>
</body>
</html>
