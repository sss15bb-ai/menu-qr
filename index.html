<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, "Segoe UI", Arial, sans-serif;
    background: #f6f6f6; color: #222; line-height: 1.6;
  }
  header {
    background: #222; color: #fff; padding: 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  header h1 { font-size: 1.3rem; }
  button { font-family: inherit; cursor: pointer; }
  #langBtn {
    background: #fff; color: #222; border: 0; border-radius: 8px;
    padding: 8px 14px; font-weight: bold;
  }
  #tabs {
    display: flex; gap: 8px; padding: 12px; overflow-x: auto;
    background: #fff; position: sticky; top: 0; border-bottom: 1px solid #ddd;
  }
  #tabs button {
    flex: 0 0 auto; border: 1px solid #222; background: #fff; color: #222;
    border-radius: 20px; padding: 8px 16px; font-size: 1rem;
  }
  #tabs button.active { background: #222; color: #fff; }
  main { max-width: 700px; margin: 0 auto; padding: 12px; }
  .item {
    background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 10px;
    display: flex; justify-content: space-between; gap: 12px;
  }
  .item h3 { font-size: 1.05rem; }
  .item p { color: #666; font-size: 0.9rem; }
  .price { font-weight: bold; white-space: nowrap; }
  footer { text-align: center; padding: 16px; color: #777; font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <h1 id="shopName"></h1>
  <button id="langBtn" type="button"></button>
</header>

<nav id="tabs"></nav>
<main id="items"></main>
<footer id="footer"></footer>

<script>
// ===== Edit client data here =====
const SHOP = { ar: "تجربة التعديل", en: "Edit Test" };
const CURRENCY = { ar: "ريال", en: "SAR" };
const FOOTER = { ar: "بيانات تجريبية", en: "Sample data" };

const MENU = [
  { ar: "القسم الأول", en: "Category 1", items: [
    { ar: "الصنف 1", en: "Item 1", descAr: "وصف الصنف", descEn: "Item description", price: 0 },
    { ar: "الصنف 2", en: "Item 2", descAr: "وصف الصنف", descEn: "Item description", price: 0 }
  ]},
  { ar: "القسم الثاني", en: "Category 2", items: [
    { ar: "الصنف 3", en: "Item 3", descAr: "وصف الصنف", descEn: "Item description", price: 0 },
    { ar: "الصنف 4", en: "Item 4", descAr: "وصف الصنف", descEn: "Item description", price: 0 }
  ]}
];
// ==========================================

let lang = "ar";
let activeCategory = 0;

function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("shopName").textContent = SHOP[lang];
  document.getElementById("footer").textContent = FOOTER[lang];
  document.getElementById("langBtn").textContent = lang === "ar" ? "English" : "العربية";

  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  MENU.forEach(function (cat, i) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = cat[lang];
    if (i === activeCategory) b.className = "active";
    b.addEventListener("click", function () { activeCategory = i; render(); });
    tabs.appendChild(b);
  });

  const list = document.getElementById("items");
  list.innerHTML = "";
  MENU[activeCategory].items.forEach(function (it) {
    const row = document.createElement("div");
    row.className = "item";
    const info = document.createElement("div");
    const name = document.createElement("h3");
    name.textContent = it[lang];
    const desc = document.createElement("p");
    desc.textContent = lang === "ar" ? it.descAr : it.descEn;
    info.appendChild(name);
    info.appendChild(desc);
    const price = document.createElement("div");
    price.className = "price";
    price.textContent = it.price + " " + CURRENCY[lang];
    row.appendChild(info);
    row.appendChild(price);
    list.appendChild(row);
  });
}

document.getElementById("langBtn").addEventListener("click", function () {
  lang = lang === "ar" ? "en" : "ar";
  render();
});

render();
</script>
</body>
</html>
